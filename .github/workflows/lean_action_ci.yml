name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Install locked Python development environment
        run: |
          python -m pip install uv==0.13.10
          uv sync --locked --group dev --extra test
      - name: Python tests including real Lean bridge
        run: uv run pytest -q -p no:cacheprovider --basetemp runs/ci-pytest
      - name: Strict Python types and formatting
        run: |
          uv run mypy --strict src/ai4algebra retrieval_ddqn tests
          uv run ruff check src/ai4algebra retrieval_ddqn tests
          uv run ruff format --check src/ai4algebra retrieval_ddqn tests
      - uses: leanprover-community/docgen-action@v1
